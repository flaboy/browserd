name: Docker CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/flaboy/browserd

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify pinned snapshot runtime
        run: |
          bash internal/browser/generate_browser_snapshot_runtime.sh
          git diff --exit-code -- internal/browser/browser_snapshot_runtime.go
      - name: Go tests
        run: go test -race ./...
      - name: Native Chrome snapshot and action regression
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          # Initialize the runner's system Chrome before testing browserd sessions.
          # This is environment setup, not an API retry or cold-start acceptance.
          timeout 30s "$CHROME_BIN" --headless --no-sandbox --disable-gpu --user-data-dir="$RUNNER_TEMP/chrome-bootstrap" --dump-dom about:blank > "$RUNNER_TEMP/chrome-bootstrap.html" 2> "$RUNNER_TEMP/chrome-bootstrap.log"
          export BROWSERD_PORT=7021 BROWSERD_BASE_URL=http://127.0.0.1:7021
          export BROWSERD_PROFILE_STORE=file BROWSERD_PROFILE_FILE_ROOT="$RUNNER_TEMP/profiles"
          export BROWSERD_WORKDIR="$RUNNER_TEMP/browserd-work"
          go build -o "$RUNNER_TEMP/browserd" ./cmd/browserd
          "$RUNNER_TEMP/browserd" > "$RUNNER_TEMP/browserd.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; wait "$server_pid" || true' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent "$BROWSERD_BASE_URL/healthz" > /dev/null; then break; fi
            sleep 0.2
          done
          go test ./e2e -run 'TestNavigateSnapshotE2E|TestSnapshotDOMTreeE2E' -count=1 -timeout 3m -v
      - name: Retain browser test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-browser-test
          path: |
            ${{ runner.temp }}/browserd.log
            ${{ runner.temp }}/chrome-bootstrap.log

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and (optionally) push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
