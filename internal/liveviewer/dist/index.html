<html lang="en">

        <button type="button" data-key="Enter" aria-label="Enter">↵</button>
        <button type="button" data-key="Tab" aria-label="Tab">⇥</button>
        <button type="button" data-key="Escape" aria-label="Escape">Esc</button>
