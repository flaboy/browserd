apiVersion: apps/v1
kind: Deployment
metadata:
  name: browserd
  labels:
    app: browserd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browserd
  template:
    metadata:
      labels:
        app: browserd
    spec:
      initContainers:
        - name: prepare-x11-socket-dir
          image: browserd:dev
          command:
            - sh
            - -c
            - mkdir -p /tmp/.X11-unix && chown 0:0 /tmp/.X11-unix && chmod 1777 /tmp/.X11-unix
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: workdir
              mountPath: /tmp
      containers:
        - name: browserd
          image: browserd:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7011
              name: http
          env:
            - name: BROWSERD_PORT
              value: "7011"
            - name: BROWSERD_CDP_BASE_URL
              value: "ws://browserd:9222/devtools/browser"
            - name: BROWSERD_LIVE_ENABLED
              value: "true"
            - name: BROWSERD_LIVE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: octopus-cluster-config
                  key: browserLiveBaseURL
            - name: BROWSERD_LIVE_TOKEN_TTL
              value: "15m"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workdir
              mountPath: /tmp
      volumes:
        - name: workdir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: browserd
  labels:
    app: browserd
spec:
  selector:
    app: browserd
  ports:
    - name: http
      port: 7011
      targetPort: http
